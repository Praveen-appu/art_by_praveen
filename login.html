<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Art_by_praveen</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#080808;
    color:#fff;
    font-family:'Inter',sans-serif;
    overflow:hidden;
}

/* =========================
   BACKGROUND
========================= */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.glow{
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        rgba(255,255,255,.08),
        transparent 70%
    );
    right:-100px;
    top:50%;
    transform:translateY(-50%);
}

.glow2{
    position:absolute;
    width:400px;
    height:400px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        rgba(255,255,255,.05),
        transparent 70%
    );
    left:-150px;
    bottom:-150px;
}

/* =========================
   PARTICLES
========================= */

.particle{
    position:absolute;
    width:3px;
    height:3px;
    background:#777;
    border-radius:50%;
    opacity:.5;
    animation:float 7s infinite ease-in-out;
}

.p1{left:12%;top:20%;animation-delay:0s;}
.p2{left:25%;top:75%;animation-delay:2s;}
.p3{left:72%;top:18%;animation-delay:1s;}
.p4{left:85%;top:72%;animation-delay:3s;}
.p5{left:52%;top:85%;animation-delay:4s;}
.p6{left:40%;top:12%;animation-delay:2.5s;}

@keyframes float{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-30px);
    }

}

/* =========================
   BACK BUTTON
========================= */

.back-home{
    position:absolute;
    top:30px;
    left:40px;
    color:#aaa;
    text-decoration:none;
    font-size:12px;
    letter-spacing:1px;
    z-index:20;
    transition:.3s;
}

.back-home:hover{
    color:#fff;
    transform:translateX(-5px);
}

/* =========================
   MAIN
========================= */

.container{
    min-height:100vh;
    display:grid;
    grid-template-columns:1fr 1fr;
    position:relative;
    z-index:2;
}

/* =========================
   LEFT SIDE
========================= */

.visual{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    border-right:1px solid #222;
    overflow:hidden;
}

.visual-content{
    text-align:center;
    position:relative;
    z-index:3;
}

.brand{
    font-family:'Cormorant Garamond',serif;
    font-size:54px;
    letter-spacing:4px;
}

.brand span{
    color:#777;
}

.tagline{
    margin-top:15px;
    color:#777;
    font-size:10px;
    letter-spacing:5px;
    text-transform:uppercase;
}

/* =========================
   SKETCH
========================= */

.sketch{
    width:330px;
    height:420px;
    position:absolute;
    border:1px solid #292929;
    transform:rotate(-7deg);
    opacity:.7;
}

.sketch::before{
    content:"";
    position:absolute;
    inset:30px;
    border:1px dashed #333;
}

.face{
    width:150px;
    height:235px;
    border:2px solid #555;
    border-radius:48% 45% 50% 48%;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) rotate(-7deg);
}

.face::before{
    content:"";
    position:absolute;
    width:6px;
    height:6px;
    background:#888;
    border-radius:50%;
    left:43px;
    top:82px;
    box-shadow:58px 0 #888;
}

.face::after{
    content:"";
    position:absolute;
    width:55px;
    height:28px;
    border-bottom:2px solid #666;
    border-radius:50%;
    left:46px;
    bottom:53px;
}

/* =========================
   PENCIL
========================= */

.pencil{
    position:absolute;
    width:230px;
    height:8px;
    background:linear-gradient(
        90deg,
        #222,
        #aaa,
        #eee,
        #555
    );
    transform:rotate(-45deg);
    opacity:.35;
    animation:pencilMove 5s infinite ease-in-out;
}

.pencil::after{
    content:"";
    position:absolute;
    right:-18px;
    top:-4px;
    border-left:20px solid #c9ae87;
    border-top:8px solid transparent;
    border-bottom:8px solid transparent;
}

@keyframes pencilMove{

    0%,100%{
        transform:rotate(-45deg) translate(0);
    }

    50%{
        transform:rotate(-45deg) translate(25px,-20px);
    }

}

/* =========================
   RIGHT SIDE
========================= */

.login-area{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.login-box{
    width:100%;
    max-width:420px;
    animation:loginAppear 1s ease forwards;
}

@keyframes loginAppear{

    from{
        opacity:0;
        transform:translateY(35px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.login-label{
    color:#777;
    font-size:10px;
    letter-spacing:4px;
    margin-bottom:15px;
}

.login-box h1{
    font-family:'Cormorant Garamond',serif;
    font-size:60px;
    font-weight:500;
}

.subtitle{
    color:#777;
    font-size:13px;
    line-height:1.7;
    margin-top:8px;
    margin-bottom:35px;
}

/* =========================
   INPUT
========================= */

.input-group{
    position:relative;
    margin-bottom:22px;
}

.input-group input{
    width:100%;
    height:55px;
    background:#111;
    border:1px solid #2d2d2d;
    outline:none;
    color:#fff;
    padding:0 18px;
    font-size:13px;
    transition:.3s;
}

.input-group input:focus{
    border-color:#777;
    background:#141414;
}

.input-group label{
    position:absolute;
    left:18px;
    top:19px;
    color:#666;
    font-size:12px;
    pointer-events:none;
    transition:.3s;
}

.input-group input:focus + label,
.input-group input:not(:placeholder-shown) + label{
    top:-7px;
    left:12px;
    padding:0 7px;
    background:#080808;
    color:#aaa;
    font-size:10px;
}

/* =========================
   PASSWORD BUTTON
========================= */

.password-wrap{
    position:relative;
}

.show-password{
    position:absolute;
    right:15px;
    top:19px;
    color:#777;
    font-size:11px;
    cursor:pointer;
    user-select:none;
}

.show-password:hover{
    color:#fff;
}

/* =========================
   OPTIONS
========================= */

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
    margin-bottom:25px;
    font-size:11px;
}

.remember{
    color:#777;
    display:flex;
    align-items:center;
    gap:7px;
}

.remember input{
    accent-color:#fff;
}

.forgot{
    color:#aaa;
    text-decoration:none;
}

.forgot:hover{
    color:#fff;
}

/* =========================
   LOGIN BUTTON
========================= */

.login-btn{
    width:100%;
    height:55px;
    border:none;
    background:#fff;
    color:#000;
    font-size:11px;
    letter-spacing:2px;
    cursor:pointer;
    transition:.35s;
}

.login-btn:hover{
    background:#ddd;
    transform:translateY(-3px);
    box-shadow:0 15px 30px rgba(255,255,255,.08);
}

/* =========================
   DIVIDER
========================= */

.divider{
    display:flex;
    align-items:center;
    gap:15px;
    margin:25px 0;
    color:#555;
    font-size:10px;
}

.divider::before,
.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:#252525;
}

/* =========================
   SOCIAL LOGIN
========================= */

.google-btn{
    width:100%;
    height:50px;
    background:#111;
    border:1px solid #292929;
    color:#ddd;
    cursor:pointer;
    font-size:11px;
    transition:.3s;
}

.google-btn:hover{
    border-color:#666;
    background:#151515;
}

/* =========================
   SIGNUP
========================= */

.signup{
    text-align:center;
    margin-top:28px;
    color:#666;
    font-size:12px;
}

.signup a{
    color:#fff;
    text-decoration:none;
    margin-left:5px;
}

.signup a:hover{
    text-decoration:underline;
}

/* =========================
   SUCCESS MESSAGE
========================= */

.message{
    position:fixed;
    top:25px;
    right:25px;
    background:#fff;
    color:#000;
    padding:16px 22px;
    font-size:12px;
    transform:translateX(150%);
    transition:.5s;
    z-index:100;
}

.message.show{
    transform:translateX(0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:850px){

    body{
        overflow:auto;
    }

    .container{
        display:block;
    }

    .visual{
        min-height:300px;
        border-right:none;
        border-bottom:1px solid #222;
    }

    .sketch{
        width:220px;
        height:280px;
    }

    .face{
        width:100px;
        height:165px;
    }

    .brand{
        font-size:35px;
    }

    .login-area{
        min-height:calc(100vh - 300px);
        padding:45px 25px;
    }

}

@media(max-width:500px){

    .back-home{
        left:20px;
        top:20px;
    }

    .visual{
        min-height:250px;
    }

    .login-box h1{
        font-size:48px;
    }

}

</style>

</head>

<body>


<!-- BACKGROUND -->

<div class="background">

    <div class="glow"></div>
    <div class="glow2"></div>

    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>
    <div class="particle p6"></div>

</div>


<!-- BACK -->

<a href="index.html" class="back-home">
    ← BACK TO HOME
</a>


<!-- MAIN -->

<div class="container">


    <!-- LEFT -->

    <div class="visual">

        <div class="sketch"></div>

        <div class="pencil"></div>

        <div class="face"></div>

        <div class="visual-content">

            <div class="brand">
                ART<span>_BY_</span>PRAVEEN
            </div>

            <div class="tagline">
                Pencil • Portrait • Art
            </div>

        </div>

    </div>


    <!-- RIGHT -->

    <div class="login-area">

        <div class="login-box">

            <div class="login-label">
                WELCOME BACK
            </div>

            <h1>
                Login
            </h1>

            <p class="subtitle">
                Enter your account and continue
                your creative journey.
            </p>


            <!-- EMAIL -->

            <div class="input-group">

                <input
                    type="email"
                    id="email"
                    placeholder=" "
                    autocomplete="email"
                >

                <label>
                    Email Address
                </label>

            </div>


            <!-- PASSWORD -->

            <div class="input-group password-wrap">

                <input
                    type="password"
                    id="password"
                    placeholder=" "
                    autocomplete="current-password"
                >

                <label>
                    Password
                </label>

                <span
                    class="show-password"
                    onclick="togglePassword()"
                    id="showBtn"
                >
                    SHOW
                </span>

            </div>


            <!-- OPTIONS -->

            <div class="options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    Remember me

                </label>

                <a href="#" class="forgot">
                    Forgot Password?
                </a>

            </div>


            <!-- LOGIN -->

            <button
                class="login-btn"
                onclick="loginUser()"
            >
                LOGIN TO ART_BY_PRAVEEN
            </button>


            <!-- DIVIDER -->

            <div class="divider">
                OR
            </div>


            <!-- GOOGLE -->

            <button
                class="google-btn"
                onclick="googleLogin()"
            >
                Continue with Google
            </button>


            <!-- SIGNUP -->

            <div class="signup">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </div>

        </div>

    </div>

</div>


<!-- MESSAGE -->

<div class="message" id="message">
    Login successful!
</div>


<script>

/* =========================
   PASSWORD SHOW / HIDE
========================= */

function togglePassword(){

    const password =
        document.getElementById("password");

    const button =
        document.getElementById("showBtn");

    if(password.type === "password"){

        password.type = "text";

        button.textContent = "HIDE";

    }else{

        password.type = "password";

        button.textContent = "SHOW";

    }

}


/* =========================
   LOGIN
========================= */

function loginUser() {

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    if (!emailInput || !passwordInput) {
        alert("Login fields not found.");
        return;
    }

    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();

    /* Empty field check */

    if (email === "" || password === "") {

        alert("Please enter your email and password.");
        return;

    }


    /* Get registered account */

    const savedUser =
        localStorage.getItem("artByPraveenUser");


    if (!savedUser) {

        alert(
            "No account found. Please create an account first."
        );

        window.location.href = "signup.html";

        return;

    }


    let user;

    try {

        user = JSON.parse(savedUser);

    } catch (error) {

        alert(
            "Account data error. Please create your account again."
        );

        localStorage.removeItem("artByPraveenUser");

        window.location.href = "signup.html";

        return;

    }


    /* Check email */

    if (
        !user.email ||
        email.toLowerCase() !== user.email.toLowerCase()
    ) {

        alert(
            "Email does not match your registered account."
        );

        return;

    }


    /* Login successful */

    localStorage.setItem(
        "artByPraveenLoggedIn",
        "true"
    );


    /* Open Dashboard */

    window.location.href =
        "profile.html";

}

/* =========================
   GOOGLE LOGIN
========================= */

function googleLogin(){

    showMessage(
        "Google login will be connected later."
    );

}


/* =========================
   MESSAGE
========================= */

function showMessage(text){

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.classList.add("show");

    setTimeout(()=>{

        message.classList.remove("show");

    },2500);

}

</script>

</body>
</html>
